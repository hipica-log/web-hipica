backend:
  name: git-gateway
  branch: main

media_folder: "public/imagenes/uploads"
public_folder: "/imagenes/uploads"

collections:
  - name: "noticias"
    label: "Noticias y Avisos"
    folder: "src/data/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Categoría", name: "category", widget: "select", options: ["General", "Equitación", "Tenis y Pádel", "Eventos"]}
      - {label: "Imagen destacada", name: "thumbnail", widget: "image", required: false}
      - {label: "Cuerpo de la noticia", name: "body", widget: "markdown"}
