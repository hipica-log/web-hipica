backend:
  name: git-gateway
  branch: main # Cambia a 'master' si tu rama principal se llama así

media_folder: "public/imagenes/uploads" # Dónde se guardan las fotos
public_folder: "/imagenes/uploads" # Cómo se enlazan las fotos en la web

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "src/pages/noticias" # Dónde se guardarán los archivos Markdown de las noticias
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Imagen destacada", name: "thumbnail", widget: "image", required: false}
      - {label: "Cuerpo de la noticia", name: "body", widget: "markdown"}